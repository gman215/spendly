{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block content %}

<section class="expense-section">
    <div class="expense-container">

        <div class="expense-header">
            <h1 class="expense-title">Add an expense</h1>
            <p class="expense-subtitle">Log what you spent and when</p>
        </div>

        <div class="expense-card">
            {% if error %}
            <div class="expense-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/expenses/add">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="0.00"
                           step="0.01" min="0.01" max="1000000" inputmode="decimal"
                           value="{{ amount or '' }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="">Choose a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}"{% if cat == category %} selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ date or '' }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="Groceries at Trader Joe's"
                           maxlength="200"
                           value="{{ description or '' }}">
                </div>
                <button type="submit" class="btn-submit">Add expense</button>
            </form>
        </div>

        <p class="expense-cancel">
            <a href="/profile">Cancel</a>
        </p>

    </div>
</section>

{% endblock %}
